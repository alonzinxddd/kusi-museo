    <linearGradient id="colinaCuerpo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#B7C7A7"/>
      <stop offset="1" stop-color="#8FA98F"/>
    </linearGradient>
    <radialGradient id="auraCuerpo" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#F2C96B" stop-opacity=".55"/>
      <stop offset="1" stop-color="#F2C96B" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="520" fill="url(#cieloCuerpo)"/>
  <circle cx="688" cy="84" r="50" fill="#E9B44C" opacity=".9"/>
  <circle cx="688" cy="84" r="36" fill="#F2C96B"/>
