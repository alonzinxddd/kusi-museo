<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 760" role="img" aria-label="Cortina izquierda">
  <defs>
    <linearGradient id="telaRojaIzq" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8B1E1E"/>
      <stop offset="0.35" stop-color="#C0392B"/>
      <stop offset="0.7" stop-color="#922B21"/>
      <stop offset="1" stop-color="#6E1A1A"/>
    </linearGradient>
    <linearGradient id="borlaIzq" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F2C96B"/>
      <stop offset="1" stop-color="#C9973A"/>
