    <filter id="sombraIzq" x="-10%" y="-5%" width="120%" height="110%">
      <feDropShadow dx="6" dy="0" stdDeviation="8" flood-color="#3B302A" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- tela principal -->
  <path d="M0 0h420v760H0Z" fill="url(#telaRojaIzq)"/>

  <!-- pliegues verticales -->
  <g stroke="rgba(0,0,0,0.18)" stroke-width="3" fill="none" opacity="0.9">
    <path d="M38 0c-6 120 4 260 -2 400 -4 120 -6 240 2 360"/>
    <path d="M92 0c4 130 -6 270 2 410 6 120 8 230 -2 350"/>
    <path d="M150 0c-4 125 6 265 -2 405 -4 125 -6 235 2 355"/>
    <path d="M210 0c4 130 -6 270 2 410 6 120 8 230 -2 350"/>
    <path d="M272 0c-4 125 6 265 -2 405 -4 125 -6 235 2 355"/>
    <path d="M332 0c4 130 -6 270 2 410 6 120 8 230 -2 350"/>
    <path d="M388 0c-4 125 6 265 -2 405 -4 125 -6 235 2 355"/>
  </g>

  <!-- brillos suaves -->
  <g fill="rgba(255,255,255,0.06)">
    <path d="M14 0h24v760H14Z"/>
    <path d="M120 0h18v760H120Z"/>
    <path d="M250 0h16v760H250Z"/>
    <path d="M360 0h14v760H360Z"/>
  </g>

  <!-- borla dorada en la esquina inferior derecha -->
  <g transform="translate(360 700)" filter="url(#sombraIzq)">
    <ellipse cx="0" cy="0" rx="34" ry="26" fill="url(#borlaIzq)" stroke="#3B302A" stroke-width="4"/>
    <ellipse cx="0" cy="-6" rx="22" ry="14" fill="#F2C96B" stroke="#3B302A" stroke-width="3"/>
