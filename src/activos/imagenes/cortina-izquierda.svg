      <path d="M-16 22l-2 42"/>
      <path d="M-6 24l0 44"/>
      <path d="M6 24l2 44"/>
      <path d="M16 22l4 42"/>
      <path d="M26 18l6 40"/>
    </g>
  </g>

  <!-- borde superior dorado -->
  <rect x="0" y="0" width="420" height="14" fill="#C9973A" opacity="0.9"/>
  <rect x="0" y="0" width="420" height="6" fill="#F2C96B" opacity="0.7"/>
